server_tokens off;

# r5: Docker DNS publishes one A record per running app replica under the name "app".
# "resolve" makes nginx re-read that record at runtime, so replicas that are stopped or
# recreated leave/join the pool without an nginx restart. All addresses become peers.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream app_pool {
    # Strategy: Least Connections. The request goes to the replica with the
    # fewest active connections instead of a plain round-robin turn.
    least_conn;

    zone app_pool 64k;
    server app:9000 resolve max_fails=0;
    server app:9000 resolve max_fails=0;
    server app:9000 resolve max_fails=0;
}

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;
    client_max_body_size 12m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # r4: WebSocket proxy to the reverb service, so the browser only ever uses port 8080.
    # The name is resolved per request through Docker's DNS, so nginx still starts when reverb is not running.
    location /app/ {
        resolver 127.0.0.11 valid=10s;
        set $reverb_upstream http://reverb:8080;
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ \.php$ {
        fastcgi_pass app_pool;
        fastcgi_next_upstream error timeout http_500 http_503;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # r5: Docker DNS can briefly report no live replica while one is stopping.
        # One extra attempt after a 502 hides that sub-second convergence window.
        error_page 502 = @php_retry;
        # r5: makes the serving replica visible in the scaling demo.
        add_header X-Served-By $upstream_addr always;
    }

    location @php_retry {
        fastcgi_pass app_pool;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        add_header X-Served-By $upstream_addr always;
    }
}
