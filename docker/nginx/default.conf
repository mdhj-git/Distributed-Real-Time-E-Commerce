server_tokens off;

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;
    client_max_body_size 12m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # r4: WebSocket proxy to the reverb service, so the browser only ever uses port 8080.
    # The name is resolved per request through Docker's DNS, so nginx still starts when reverb is not running.
    location /app/ {
        resolver 127.0.0.11 valid=10s;
        set $reverb_upstream http://reverb:8080;
        proxy_pass $reverb_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
