services:
  # r5: one-shot setup. It runs once, before any replica exists, so three app
  # containers can never run composer / key:generate / migrate at the same time.
  # All app replicas start with RUN_SETUP=0 and depend on this succeeding.
  migrate:
    build:
      context: ./docker/app
    # Reuse the app image (do not create a separate migrate image) so a local
    # --no-build start works with the image that is already present.
    image: distributed-real-time-e-commerce-app:latest
    environment:
      RUN_SETUP: "1"
    command: ["true"]
    volumes:
      - .:/var/www
      # r5: use the current entrypoint from the mounted source even when the local
      # image is older; the Dockerfile still copies the same file at build time.
      - ./docker/app/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  # r5: three replicas of the same app service. Docker publishes the DNS name
  # "app" with one A record per replica; nginx load balances across all of them.
  app:
    build:
      context: ./docker/app
    deploy:
      replicas: 3
    environment:
      RUN_SETUP: "0"
    volumes:
      - .:/var/www
      - ./docker/app/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      retries: 10
      start_period: 60s

  nginx:
    image: nginx:alpine
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      # service_started, not service_healthy: nginx must come up even if one
      # replica is stopped, so it can route around it (Requirement 5, resiliency).
      app:
        condition: service_started

  mysql:
    image: mysql:8.4
    # r3: replica. GTIDs are needed for replication with auto-positioning. The binary log keeps 2 days
    # (a replica that stays stopped longer than that needs setup-replica.sh --reseed).
    command:
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --binlog-expire-logs-seconds=172800
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      retries: 10
      start_period: 30s

  # r3: replica
  # Read replica of "mysql". Does not start with "docker compose up -d" (profile "replica"), and every
  # compose command that targets it needs --profile replica (up, stop, start, restart, exec, logs).
  # Do NOT add read_only or super_read_only here: the image's first-boot init runs a temporary server
  # with these arguments and needs a writable server. docker/mysql-replica/setup-replica.sh sets both
  # with SET PERSIST after the data import.
  # Setup:  docker compose --profile replica exec mysql-replica bash /scripts/setup-replica.sh
  # Health: docker compose --profile replica exec -T mysql-replica bash /scripts/check-replica.sh
  mysql-replica:
    image: mysql:8.4
    profiles: ["replica"]
    command:
      - --server-id=2
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --relay-log=mysql-replica-relay-bin
      - --skip-log-bin
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      REPLICATION_USER: ${DB_REPLICATION_USER:-replicator}
      REPLICATION_PASSWORD: ${DB_REPLICATION_PASSWORD:-replica_dev}
    volumes:
      - mysql_replica_data:/var/lib/mysql
      - ./docker/mysql-replica:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

  # r4: message broker
  # Dev-only credentials; override RABBITMQ_USER / RABBITMQ_PASSWORD in .env.
  # Management UI: http://localhost:15672
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-shop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-shop_dev}
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ./docker/app
    deploy:
      replicas: 3
    entrypoint: ["sh", "-c", "php artisan rabbitmq:queue-declare orders.failed && exec php artisan queue:work rabbitmq --queue=orders --tries=3 --backoff=5"]
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # Local dev mail inbox. Emails are addressed to the real user email from users.email,
  # but delivered here so notifications can be inspected without SMTP credentials.
  # Web inbox: http://localhost:8025  (to switch to real Gmail, change MAIL_* in .env only)
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  # r4: real-time server (Laravel Reverb). Same Dockerfile as app, not published: the browser reaches it
  # through nginx on port 8080 (path /app, see docker/nginx/default.conf). Restart it after changing .env:
  #   docker compose restart reverb
  reverb:
    build:
      context: ./docker/app
    entrypoint: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--debug"]
    restart: unless-stopped
    volumes:
      - .:/var/www
    depends_on:
      migrate:
        condition: service_completed_successfully

  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    restart: unless-stopped
    environment:
      INVENTORY_DB_HOST: inventory-db
      INVENTORY_DB_PORT: 3306
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER}
      INVENTORY_DB_PASS: ${INVENTORY_DB_PASS}
      INVENTORY_GRPC_PORT: 50051
    depends_on:
      inventory-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "50051"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  inventory-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${INVENTORY_DB_NAME}
      MYSQL_USER: ${INVENTORY_DB_USER}
      MYSQL_PASSWORD: ${INVENTORY_DB_PASS}
      MYSQL_ROOT_PASSWORD: ${INVENTORY_DB_ROOT_PASS}
    volumes:
      - inventory_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      retries: 10
      start_period: 30s

  grpcurl:
    image: fullstorydev/grpcurl:v1.9.3
    volumes:
      - ./proto:/proto:ro
    profiles: ["tools"]

  # r3: measurement
  # Load generator. Does not start with "docker compose up -d".
  # Run: docker compose --profile perf run --rm k6 run /perf/k6/<script>.js
  k6:
    image: grafana/k6:2.3.0
    profiles: ["perf"]
    volumes:
      - ./perf:/perf
    environment:
      BASE_URL: http://nginx/api/v1
    depends_on:
      nginx:
        condition: service_started

volumes:
  mysql_data:
  mysql_replica_data:
  inventory_db_data:
  rabbitmq_data:
